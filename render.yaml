services:
  - type: worker
    name: job-hunter-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: free
    healthCheckPath: /
