# GitHub Actions workflow for autonomous job search
# Runs at 8 AM and 6 PM IST daily

name: Autonomous Job Search

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 6:00 PM IST = 12:30 PM UTC  
    - cron: '30 12 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job-search:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run Job Search
        run: |
          echo "Starting job search at $(date)"
          python -m job_hunter.autonomous_runner
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add job_hunter/data/jobs.json
          git add job_hunter/data/search_stats.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')"
          git push
